<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Could This Have Been an Email?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAF7FF;
    --card: #FFFFFF;
    --ink: #2B2340;
    --ink-soft: #6E6486;
    --coral: #FF6F91;
    --coral-dark: #E5577A;
    --mint: #5EEAD4;
    --mint-dark: #2FBFA8;
    --butter: #FFD166;
    --line: #ECE6FA;
    --shadow: 0 20px 45px -22px rgba(43,35,64,0.28);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:
      radial-gradient(circle at 12% 8%, rgba(255,111,145,0.10), transparent 40%),
      radial-gradient(circle at 88% 85%, rgba(94,234,212,0.14), transparent 45%),
      var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 40px 16px;
    line-height:1.5;
  }

  .card{
    width:100%;
    max-width: 560px;
    background: var(--card);
    border-radius: 28px;
    box-shadow: var(--shadow);
    position:relative;
    overflow:hidden;
  }

  .top-bar{
    padding: 30px 32px 22px;
    border-bottom: 1px solid var(--line);
    position:relative;
  }

  .tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight:600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--coral-dark);
    background: rgba(255,111,145,0.12);
    padding: 5px 11px;
    border-radius: 100px;
  }

  h1{
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: clamp(26px, 5.5vw, 32px);
    margin-top: 14px;
    letter-spacing: -0.3px;
  }

  .subtitle{
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--ink-soft);
    margin-top: 8px;
  }

  main{ padding: 26px 32px 30px; position:relative; }

  #quiz-screen{ display:block; }
  #result-screen{ display:none; }

  .progress-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
    letter-spacing: 0.5px;
  }

  .progress-track{
    height: 8px;
    background: var(--line);
    border-radius: 100px;
    margin-bottom: 26px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg, var(--coral), var(--butter));
    width: 20%;
    border-radius: 100px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
  }

  .question{
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 21px;
    margin-bottom: 18px;
    min-height: 56px;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .option{
    text-align:left;
    background: #FBFAFF;
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 14px 18px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    cursor:pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.12s ease;
  }
  .option:hover{
    border-color: var(--coral);
    background: #fff;
    transform: translateX(2px);
  }
  .option:active{ transform: scale(0.98); }

  .nav-row{
    margin-top: 20px;
    display:flex;
    justify-content:flex-start;
    align-items:center;
  }

  .back-link{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight:600;
    letter-spacing: 0.5px;
    color: var(--ink-soft);
    background:none;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
    visibility:hidden;
  }
  .back-link.show{ visibility:visible; }
  .back-link:hover{ color: var(--coral-dark); }

  /* Result screen */
  .verdict-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding: 6px 0 4px;
    position:relative;
  }

  .confetti{
    position:absolute;
    top:-10px;
    left:50%;
    width:1px; height:1px;
    pointer-events:none;
  }
  .confetti span{
    position:absolute;
    width:8px; height:8px;
    border-radius: 3px;
    opacity:0;
    animation: pop 0.9s ease forwards;
  }

  @keyframes pop{
    0%{ opacity:0; transform: translate(0,0) rotate(0deg) scale(0.4);}
    15%{ opacity:1;}
    100%{ opacity:0; transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1);}
  }

  .badge{
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 5.5vw, 28px);
    color: #fff;
    padding: 22px 26px;
    border-radius: 24px;
    line-height:1.2;
    display:inline-block;
    opacity:0;
    transform: scale(0.4) rotate(-8deg);
    animation: badgeIn 0.6s cubic-bezier(.34,1.56,.64,1) 0.1s forwards;
    box-shadow: 0 16px 32px -14px rgba(43,35,64,0.4);
  }

  @keyframes badgeIn{
    0%{ opacity:0; transform: scale(0.3) rotate(-10deg);}
    60%{ opacity:1; transform: scale(1.08) rotate(3deg);}
    80%{ transform: scale(0.96) rotate(-1deg);}
    100%{ opacity:1; transform: scale(1) rotate(0deg);}
  }

  .verdict-caption{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    font-weight:600;
    color: var(--ink-soft);
    margin-top: 22px;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity:0;
    animation: fadeUp 0.5s ease 0.55s forwards;
  }

  .verdict-text{
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    color: var(--ink);
    margin-top: 12px;
    max-width: 460px;
    opacity:0;
    animation: fadeUp 0.5s ease 0.7s forwards;
  }

  .score-line{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    font-weight:600;
    color: var(--mint-dark);
    background: rgba(94,234,212,0.15);
    padding: 6px 14px;
    border-radius: 100px;
    margin-top:18px;
    display:inline-block;
    opacity:0;
    animation: fadeUp 0.5s ease 0.85s forwards;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .result-actions{
    margin-top: 26px;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    opacity:0;
    animation: fadeUp 0.5s ease 1s forwards;
  }

  .btn{
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 13px 22px;
    border-radius: 100px;
    border: none;
    cursor:pointer;
    transition: transform 0.12s ease, opacity 0.15s ease;
  }
  .btn.primary{
    background: var(--ink);
    color: #fff;
  }
  .btn.secondary{
    background: var(--line);
    color: var(--ink);
  }
  .btn:hover{ transform: translateY(-1px); opacity:0.92; }
  .btn:active{ transform: translateY(0); }

  .copied-note{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    font-weight:600;
    color: var(--mint-dark);
    margin-top:12px;
    height:14px;
    opacity:0;
    animation: fadeUp 0.5s ease 1.1s forwards;
  }

  footer{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight:600;
    color: var(--ink-soft);
    padding: 6px 32px 26px;
    letter-spacing: 0.5px;
  }

  @media (prefers-reduced-motion: reduce){
    .badge, .verdict-caption, .verdict-text, .score-line, .result-actions, .copied-note, .confetti span{
      animation: none !important;
      opacity:1 !important;
      transform:none !important;
    }
  }

  .option:focus-visible, .btn:focus-visible, .back-link:focus-visible{
    outline: 2px solid var(--coral);
    outline-offset: 2px;
  }
</style>

</head>
<body>

<div class="card">
  <div class="top-bar">
    <span class="tag">✨ 60-second gut check</span>
    <h1>Could This Have Been an Email?</h1>
    <p class="subtitle">Answer honestly. Your calendar is watching.</p>
  </div>

  <main>
    <div id="quiz-screen">
      <div class="progress-row">
        <span id="progress-label">QUESTION 1/5</span>
        <span id="progress-pct">20%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

      <div class="question" id="question-text"></div>
      <div class="options" id="options-container"></div>

      <div class="nav-row">
        <button class="back-link" id="back-btn">← back</button>
      </div>
    </div>

    <div id="result-screen">
      <div class="verdict-wrap">
        <div class="confetti" id="confetti"></div>
        <div class="badge" id="badge-text"></div>
        <div class="verdict-caption" id="verdict-caption"></div>
        <p class="verdict-text" id="verdict-text"></p>
        <div class="score-line" id="score-line"></div>
        <div class="result-actions">
          <button class="btn primary" id="copy-btn">Copy my verdict</button>
          <button class="btn secondary" id="retake-btn">Take again</button>
        </div>
        <div class="copied-note" id="copied-note"></div>
      </div>
    </div>
  </main>

  <footer>made with mild resentment toward recurring calendar invites</footer>
</div>

<script>
  const questions = [
    {
      text: "How many people got dragged into this?",
      options: [
        { label: "9+, including a few people who've genuinely never spoken", points: 0 },
        { label: "4–8, and most of them will contribute something", points: 2 },
        { label: "2–3 of us, and we all actually need to talk", points: 3 }
      ]
    },
    {
      text: "What's this meeting actually FOR?",
      options: [
        { label: "It's on the calendar because it was on the calendar last week", points: 0 },
        { label: "A real, live decision that needs real, live people", points: 3 },
        { label: "Someone's about to read updates off a slide", points: 0 }
      ]
    },
    {
      text: "Will opinions actually change in the room?",
      options: [
        { label: "It's mostly one person talking, everyone else nodding", points: 0 },
        { label: "Yes, genuinely, minds will be changed by the end", points: 3 },
        { label: "Maybe a little, but it could just as easily happen in a chat", points: 2 }
      ]
    },
    {
      text: "Is there an agenda?",
      options: [
        { label: "There's a doc somewhere. It's been open in a tab. Unread.", points: 2 },
        { label: "Not really, we'll figure out the point once we're in there", points: 0 },
        { label: "Yes, and someone's actually running the room off it", points: 3 }
      ]
    },
    {
      text: "Could this die quietly in a Teams chat instead?",
      options: [
        { label: "Mostly, maybe with one clarifying reply needed", points: 2 },
        { label: "No, the timing and tone genuinely matter here", points: 3 },
        { label: "Completely. Nothing here needed a live room.", points: 0 }
      ]
    }
  ];

  function shuffle(array){
    const arr = array.slice();
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  let currentQ = 0;
  const answers = [];

  const questionText = document.getElementById('question-text');
  const optionsContainer = document.getElementById('options-container');
  const progressLabel = document.getElementById('progress-label');
  const progressPct = document.getElementById('progress-pct');
  const progressFill = document.getElementById('progress-fill');
  const backBtn = document.getElementById('back-btn');
  const quizScreen = document.getElementById('quiz-screen');
  const resultScreen = document.getElementById('result-screen');

  let shuffledOptions = [];

  function renderQuestion(){
    const q = questions[currentQ];
    questionText.textContent = q.text;
    optionsContainer.innerHTML = '';
    shuffledOptions = shuffle(q.options);
    shuffledOptions.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.textContent = opt.label;
      btn.addEventListener('click', () => selectOption(idx));
      optionsContainer.appendChild(btn);
    });

    const pct = Math.round(((currentQ) / questions.length) * 100) + 20;
    progressLabel.textContent = `QUESTION ${currentQ + 1}/${questions.length}`;
    progressPct.textContent = Math.min(pct,100) + '%';
    progressFill.style.width = Math.min(pct,100) + '%';
    backBtn.classList.toggle('show', currentQ > 0);
  }

  function selectOption(idx){
    answers[currentQ] = shuffledOptions[idx].points;
    if(currentQ < questions.length - 1){
      currentQ++;
      renderQuestion();
    } else {
      showResult();
    }
  }

  backBtn.addEventListener('click', () => {
    if(currentQ > 0){
      currentQ--;
      renderQuestion();
    }
  });

  function computeScore(){
    return answers.reduce((a,b) => a + (b||0), 0);
  }

  function getVerdict(score){
    if(score <= 5){
      return {
        badge: "💌 Email it.",
        color: "linear-gradient(135deg, #FF6F91, #E5577A)",
        caption: "VERDICT: COULD'VE BEEN AN EMAIL",
        text: "This was a status update cosplaying as a meeting. No decisions, no discussion, no reason anyone needed to be live for it. Send the email. Reclaim the hour. Live your life.",
      };
    } else if(score <= 11){
      return {
        badge: "😐 Downgrade it.",
        color: "linear-gradient(135deg, #FFD166, #E5A82E)",
        caption: "VERDICT: COULD'VE BEEN A TEAMS CHAT",
        text: "There's a real point buried in here somewhere. It just didn't need 8 blocked calendars to find it. A clear message with a clear ask would've worked fine.",
      };
    } else {
      return {
        badge: "😌 Keep it.",
        color: "linear-gradient(135deg, #5EEAD4, #2FBFA8)",
        caption: "VERDICT: LEGITIMATE MEETING",
        text: "Rare and precious. Real discussion, real decisions, real humans needed in real time. Go forth and meet.",
      };
    }
  }

  function launchConfetti(){
    const container = document.getElementById('confetti');
    container.innerHTML = '';
    const colors = ['#FF6F91','#5EEAD4','#FFD166','#2B2340'];
    for(let i=0;i<18;i++){
      const p = document.createElement('span');
      const angle = Math.random()*Math.PI*2;
      const dist = 60 + Math.random()*70;
      const x = Math.cos(angle)*dist;
      const y = Math.sin(angle)*dist - 20;
      p.style.setProperty('--x', x+'px');
      p.style.setProperty('--y', y+'px');
      p.style.setProperty('--r', (Math.random()*360)+'deg');
      p.style.background = colors[i % colors.length];
      p.style.animationDelay = (Math.random()*0.15)+'s';
      container.appendChild(p);
    }
  }

  function showResult(){
    quizScreen.style.display = 'none';
    resultScreen.style.display = 'block';

    const score = computeScore();
    const verdict = getVerdict(score);

    const badgeEl = document.getElementById('badge-text');
    badgeEl.textContent = verdict.badge;
    badgeEl.style.background = verdict.color;
    document.getElementById('verdict-caption').textContent = verdict.caption;
    document.getElementById('verdict-text').textContent = verdict.text;
    document.getElementById('score-line').textContent = `Meeting Necessity Score: ${score}/15`;

    badgeEl.style.animation = 'none';
    void badgeEl.offsetWidth;
    badgeEl.style.animation = '';
    launchConfetti();
  }

  document.getElementById('retake-btn').addEventListener('click', () => {
    currentQ = 0;
    answers.length = 0;
    resultScreen.style.display = 'none';
    quizScreen.style.display = 'block';
    renderQuestion();
  });

  document.getElementById('copy-btn').addEventListener('click', () => {
    const score = computeScore();
    const verdict = getVerdict(score);
    const text = `My meeting scored ${score}/15 on the Meeting Necessity Scale.\nVerdict: "${verdict.badge}"\n\nWhat's yours? →`;
    navigator.clipboard.writeText(text).then(() => {
      const note = document.getElementById('copied-note');
      note.textContent = 'copied — paste it wherever 🎉';
      setTimeout(() => { note.textContent = ''; }, 3000);
    }).catch(() => {
      const note = document.getElementById('copied-note');
      note.textContent = 'select and copy the text above manually';
    });
  });

  renderQuestion();
</script>

</body>
</html>
